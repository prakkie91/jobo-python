name: Release

# Merging a version bump is the release. Every push to main reads the version
# out of pyproject.toml and compares it with PyPI: unchanged means there is
# nothing to do, new means test, publish, and tag. No tag to cut by hand, and
# the manifest stays the single source of truth for the version.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.published.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from pyproject.toml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Is it already on PyPI?
        id: published
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CODE=$(curl -sS --retry 3 --retry-all-errors -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/jobo-enterprise/$VERSION/json")
          # Anything other than a clean hit or miss is a bad answer, not a
          # licence to publish over the top of an existing release.
          if [ "$CODE" != "200" ] && [ "$CODE" != "404" ]; then
            echo "::error::PyPI returned HTTP $CODE for $VERSION — refusing to guess."
            exit 1
          fi
          if [ "$CODE" = "200" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$VERSION is already on PyPI — nothing to release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$VERSION is not on PyPI — releasing."
          fi

  test:
    needs: check
    if: needs.check.outputs.publish == 'true'
    # Reuses the Tests workflow rather than restating it, so there is one
    # definition of what "the tests pass" means.
    uses: ./.github/workflows/test.yml
    secrets: inherit

  publish:
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release tag
      id-token: write # PyPI trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      # Only after the registry has it, so a failed publish leaves no tag behind.
      - name: Tag the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.check.outputs.version }}" \
            --title "v${{ needs.check.outputs.version }}" \
            --generate-notes
